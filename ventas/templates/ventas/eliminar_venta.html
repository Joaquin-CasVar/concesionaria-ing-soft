{% extends 'autos/base.html' %}

{% block body %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body text-center">
                <h1 class="h4 card-title text-danger mb-3">Anular Venta</h1>
                <p class="mb-1">¿Estás seguro de anular esta venta?</p>
                <h5 class="fw-bold mb-4">{{ venta.auto }} — {{ venta.cliente }} ({{ venta.fecha }})</h5>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger">Sí, anular</button>
                        <a href="{% url 'ventas' %}" class="btn btn-outline-secondary">No, volver</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
